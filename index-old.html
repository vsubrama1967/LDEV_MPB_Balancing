<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:860},&quot;writeWeightFactor&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:4,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;,&quot;unit&quot;:&quot;\u00d7&quot;},&quot;defaultTolerance&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2,&quot;min&quot;:0.5,&quot;max&quot;:15,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;,&quot;unit&quot;:&quot;%&quot;},&quot;randomThresholdKb&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:64,&quot;min&quot;:16,&quot;max&quot;:256,&quot;step&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;,&quot;unit&quot;:&quot;KB&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Demo&quot;}}">
class Component extends DCLogic {
  state = this.buildInitial();

  S = {
    card:{background:"#fff",border:"1px solid var(--border-subtle)",borderRadius:6,padding:24},
    th:{fontSize:11,fontWeight:600,letterSpacing:".06em",textTransform:"uppercase",color:"var(--text-tertiary)",padding:"0 14px 12px",borderBottom:"1px solid var(--border-default)",whiteSpace:"nowrap"},
    td:{padding:"11px 14px",borderBottom:"1px solid var(--border-subtle)",whiteSpace:"nowrap"},
    overline:{fontSize:11,fontWeight:600,letterSpacing:".09em",textTransform:"uppercase",color:"var(--text-tertiary)",marginBottom:5,lineHeight:1.35},
    label:{fontSize:12,fontWeight:600,color:"var(--text-secondary)",marginBottom:6,display:"block"},
    inp:{width:"100%",padding:"9px 12px",border:"1px solid var(--border-default)",borderRadius:4,fontSize:14,fontFamily:"inherit",boxSizing:"border-box",background:"#fff",color:"var(--hv-black)"}
  };

  // ---------- numeric helpers ----------
  nf(n,d){ d=(d==null)?1:d; if(n==null||!isFinite(n)) return "\u2014"; return Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
  pct(n){ if(!isFinite(n)) return "\u2014"; return (n>=0?"+":"")+this.nf(n,1)+"%"; }
  rng(seed){ let s=seed>>>0; return function(){ s=(s+0x6D2B79F5)>>>0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  writeW(){ if(this.state&&this.state.writeWeight!=null) return Number(this.state.writeWeight); return this.props.writeWeightFactor!=null?Number(this.props.writeWeightFactor):2; }

  // ---------- sample data ----------
  genSample(seed){
    const r=this.rng(seed||7);
    const mpbs=["MPU-010","MPU-020"];
    const arr="840130";
    let idx=0;
    const hex=(x)=>x.toString(16).toUpperCase().padStart(2,"0");
    const nid=()=>{ const a=idx++; return "00:"+hex(Math.floor(a/256))+":"+hex(a%256); };
    const ldevs=[];
    const push=(name,mpb,rI,wI,kbps)=>{ const sp=(rI+wI)>0?rI/(rI+wI):0.5; ldevs.push({id:nid(),name:name,mpb:mpb,readIOPS:rI,writeIOPS:wI,readKBps:kbps*sp,writeKBps:kbps*(1-sp)}); };
    // heavy random whales on MPU-020 (the source of the imbalance)
    push("JDT-UVM-Vol","MPU-020",3034.5,3035,24290);
    push("GAD-Workshop","MPU-020",1417,2816,17010);
    push("OLTP-RedoLog-01","MPU-020",900,1400,11000);
    const names=["PROD_ESX_DATASTORE","DEV_ESX_DATASTORE","SQL_DATA","SQL_LOG","ORA_DATA","ORA_ARCH","VDI_POOL","BACKUP_TGT","FS_HOME","ANALYTICS_TMP","CITRIX_PVS","EXCHANGE_DB","K8S_PV","REPL_JOURNAL"];
    const mk=(i)=>names[i%names.length]+String(Math.floor(i/names.length)+1).padStart(2,"0");
    for(let i=0;i<96;i++){ const rI=r()*40+1, wI=r()*18; const seq=r()<0.25; const ioKB=seq?(64+r()*170):(4+r()*16); push(mk(i),"MPU-020",rI,wI,(rI+wI)*ioKB); }
    for(let i=0;i<139;i++){ const rI=r()*34+1, wI=r()*14; const seq=r()<0.3; const ioKB=seq?(64+r()*190):(4+r()*18); push(mk(96+i),"MPU-010",rI,wI,(rI+wI)*ioKB); }
    // Synthesize a per-blade utilization time series (48 points over the last 24h)
    // so the sample/demo shows the same real-series chart shape as live data.
    const NB=48, end=Date.now(), t0=end-24*36e5, times=[]; for(let b=0;b<NB;b++) times.push(Math.round(t0+(b+0.5)/NB*(end-t0)));
    const bladeMean={}; mpbs.forEach(m=>{ let sc=0; ldevs.forEach(l=>{ if(l.mpb===m){ sc+=(l.readIOPS+2*l.writeIOPS); } }); bladeMean[m]=sc; });
    const maxMean=Math.max.apply(null,mpbs.map(m=>bladeMean[m]))||1;
    const blades=mpbs.map(m=>{ const rr=this.rng(m.split("").reduce((a,c)=>a+c.charCodeAt(0),0)); const mean=Math.max(bladeMean[m]/maxMean*11,0.4); let v=mean; const util=[]; for(let b=0;b<NB;b++){ v+=(rr()-0.5)*mean*0.5; v+=(mean-v)*0.25; if(v<0)v=0; util.push(mean*0.55+v*0.45); } return {mpb:m,util}; });
    return {ldevs,mpbs,arr,series:{start:"",end:"",times,blades}};
  }

  // ---------- scoring ----------
  derive(ldevs,thr,wW){
    ldevs.forEach(l=>{
      const tIOPS=l.readIOPS+l.writeIOPS;
      const tKBps=l.readKBps+l.writeKBps;
      const ioKB=tIOPS>0?tKBps/tIOPS:0;
      let rr; if(ioKB<=4) rr=1; else if(ioKB>=thr) rr=0; else rr=(thr-ioKB)/(thr-4);
      rr=Math.max(0,Math.min(1,rr));
      const wIOPS=l.readIOPS+wW*l.writeIOPS;
      const wMBps=(l.readKBps+wW*l.writeKBps)/1024;
      l.tIOPS=tIOPS; l.tMBps=tKBps/1024; l.ioKB=ioKB;
      l.rnd=rr; l.seq=1-rr; l.w1=rr*wIOPS; l.w2=(1-rr)*wMBps; l.score=l.w1+l.w2;
    });
    return ldevs;
  }

  // ---------- balancer (greedy single move + swap fallback) ----------
  balance(ldevs,mpbs,tol){
    const assign={}; ldevs.forEach(l=>{ assign[l.id]=l.mpb; });
    const total=ldevs.reduce((s,l)=>s+l.score,0);
    const avg=total/mpbs.length, band=avg*tol/100, plan=[];
    const scoreOf=(m)=>{ let s=0; ldevs.forEach(l=>{ if(assign[l.id]===m) s+=l.score; }); return s; };
    let iter=0;
    while(iter++<2000){
      const sc=mpbs.map(m=>({m,s:scoreOf(m)})); sc.sort((a,b)=>b.s-a.s);
      const hi=sc[0], lo=sc[sc.length-1];
      const maxDev=Math.max.apply(null,sc.map(x=>Math.abs(x.s-avg)));
      if(maxDev<=band) break;
      const gap=hi.s-lo.s, ideal=gap/2;
      const hiL=ldevs.filter(l=>assign[l.id]===hi.m);
      let best=null,bestErr=Infinity;
      hiL.forEach(l=>{ if(l.score<=0) return; const nh=hi.s-l.score, nl=lo.s+l.score; const nd=Math.max(Math.abs(nh-avg),Math.abs(nl-avg)); if(nd<maxDev-1e-9){ const er=Math.abs(l.score-ideal); if(er<bestErr){bestErr=er;best=l;} } });
      if(best){ plan.push({action:"move",ldev:best,from:hi.m,to:lo.m}); assign[best.id]=lo.m; continue; }
      const loL=ldevs.filter(l=>assign[l.id]===lo.m);
      let sw=null,sErr=Infinity;
      hiL.forEach(a=>{ loL.forEach(b=>{ const net=a.score-b.score; if(net<=0) return; const nh=hi.s-net, nl=lo.s+net; const nd=Math.max(Math.abs(nh-avg),Math.abs(nl-avg)); if(nd<maxDev-1e-9){ const er=Math.abs(net-ideal); if(er<sErr){sErr=er;sw={a,b};} } }); });
      if(sw){ plan.push({action:"swap",ldev:sw.a,ldev2:sw.b,from:hi.m,to:lo.m}); assign[sw.a.id]=lo.m; assign[sw.b.id]=hi.m; continue; }
      break;
    }
    return {assign,plan,avg,band};
  }

  summary(ldevs,mpbs,fn,avg){
    const tol=this.state.tolerance;
    return mpbs.map(m=>{ let count=0,iops=0,mbps=0,score=0; ldevs.forEach(l=>{ if(fn(l)===m){count++;iops+=l.tIOPS;mbps+=l.tMBps;score+=l.score;} });
      const dev=avg>0?((score-avg)/avg*100):0; const util=avg>0?(score/avg)*5.5:0;
      return {mpb:m,count,iops,mbps,score,dev,util,inBand:Math.abs(dev)<=tol+1e-9}; });
  }

  // ---------- data ingest ----------
  buildInitial(){
    const tol=this.props.defaultTolerance!=null?Number(this.props.defaultTolerance):2.0;
    const thr=this.props.randomThresholdKb!=null?Number(this.props.randomThresholdKb):64;
    const wW=this.props.writeWeightFactor!=null?Number(this.props.writeWeightFactor):2;
    const g=this.genSample(this.props.seed!=null?Number(this.props.seed):7);
    const ldevs=this.derive(g.ldevs,thr,wW);
    const result=this.balance(ldevs,g.mpbs,tol);
    return {active:"dashboard",loaded:true,source:"sample",status:"idle",statusMsg:"",
      demo:this.isDemoHost(),
      ldevs,mpbs:g.mpbs,arrayName:g.arr,result,tseries:g.series||null,
      metricsUrl:"/api/metrics",configUrl:"/api/config",vspIp:"192.168.53.61",vspHosts:["192.168.53.61"],storageName:"DC1-B28",
      tolerance:tol,thresholdKB:thr,writeWeight:wW,topN:15,ldevSort:"score",ldevDir:-1,showAll:false,timeRange:"24h",autoRefresh:0,autoLeft:0,
      importText:"",toast:""};
  }

  // True when served from a public GitHub Pages host — no mpb-api backend there,
  // so we run as a self-contained demo (sample dataset, live-API panel hidden).
  // True when this is the public static demo (no mpb-api backend) rather than the
  // nginx+node deployment. We guess up-front from the hostname to avoid a flash,
  // then confirm in componentDidMount by probing /api/config (the real test:
  // demo = backend unreachable). ?demo=1 forces it on; ?live=1 forces it off.
  isDemoHost(){ try{ if(/[?&]live=1\b/.test(location.search)) return false; if(/[?&]demo=1\b/.test(location.search)) return true; const hn=location.hostname; if(/(^|\.)github\.io$/i.test(hn)) return true; if(/(^|\.)clearthought\.net$/i.test(hn)) return true; return false; }catch(e){ return false; } }

  componentDidMount(){
    if(/[?&]demo=1\b/.test(location.search)) return;   // explicitly forced demo
    if(/[?&]live=1\b/.test(location.search)){ this.setState({demo:false}); return; }   // explicitly forced live (skip probe)
    // Probe the backend. Reachable /api/config => live mode; unreachable => demo.
    // Definitive, host-agnostic test; can flip the up-front guess either way.
    const ctl=(typeof AbortController!=="undefined")?new AbortController():null;
    const to=setTimeout(()=>{ if(ctl) ctl.abort(); },4000);
    fetch(this.state.configUrl,{headers:{Accept:"application/json"},signal:ctl?ctl.signal:undefined})
      .then(r=>{ if(!r.ok) throw new Error("no backend (HTTP "+r.status+")"); return r.json(); })
      .then(c=>{ clearTimeout(to); const patch={demo:false}; if(c){ const hosts=Array.isArray(c.hosts)?c.hosts.filter(Boolean):[]; if(hosts.length) patch.vspHosts=hosts; const def=c.host||(hosts.length?hosts[0]:null); if(def){ patch.vspIp=def; if(hosts.length&&hosts.indexOf(def)<0) patch.vspHosts=[def].concat(hosts); } if(c.chunkDays) patch.chunkDays=c.chunkDays; } this.setState(patch); })
      .catch(()=>{ clearTimeout(to); this.setState({demo:true}); });   // backend unreachable => demo
  }
  vspEndpointUrl(){ const ip=(this.state.vspIp||"").trim(); return ip?("https://"+ip+"/clearsightadvanced/dbapi.do?action=query&dataset=defaultDs&processSync=true"):""; }
  componentDidUpdate(prev){
    if(prev.writeWeightFactor!==this.props.writeWeightFactor || prev.randomThresholdKb!==this.props.randomThresholdKb || prev.defaultTolerance!==this.props.defaultTolerance){
      const patch={};
      if(prev.randomThresholdKb!==this.props.randomThresholdKb && this.props.randomThresholdKb!=null) patch.thresholdKB=Number(this.props.randomThresholdKb);
      if(prev.defaultTolerance!==this.props.defaultTolerance && this.props.defaultTolerance!=null) patch.tolerance=Number(this.props.defaultTolerance);
      this.recompute(patch);
    }
    if(prev.seed!==this.props.seed){ const g=this.genSample(Number(this.props.seed)||7); this.applyData(g,"sample"); }
  }

  recompute(patch){
    this.setState(prev=>{
      const next=Object.assign({},prev,patch);
      const ldevs=this.derive(prev.ldevs,next.thresholdKB,next.writeWeight!=null?Number(next.writeWeight):this.writeW());
      next.ldevs=ldevs; next.result=this.balance(ldevs,next.mpbs,next.tolerance);
      return next;
    });
  }

  applyData(parsed,source){
    const ldevs=this.derive(parsed.ldevs,this.state.thresholdKB,this.writeW());
    const result=this.balance(ldevs,parsed.mpbs,this.state.tolerance);
    this.setState({ldevs,mpbs:parsed.mpbs,arrayName:parsed.arr,result,source,loaded:true,showAll:false,tseries:parsed.series||null});
  }

  loadSample(){ this.stopAutoRefresh(); const g=this.genSample(Math.floor(Math.random()*1e6)); this.applyData(g,"sample"); this.setState({active:"dashboard"}); this.toast("Loaded sample dataset"); }

  importJson(){ this.stopAutoRefresh(); try{ const p=this.parseExternal(this.state.importText); this.applyData(p,"import"); const sk=p.skipped?(" \u00b7 "+p.skipped+" skipped (no MPB assignment)"):""; this.setState({active:"dashboard",status:"ok",statusMsg:"Imported "+p.ldevs.length+" LDEVs across "+p.mpbs.length+" MPBs."+sk}); this.toast("Imported "+p.ldevs.length+" LDEVs"+sk); }catch(e){ this.setState({status:"error",statusMsg:e.message}); this.toast("Import failed"); } }

  parseExternal(text){
    let json; try{ json=JSON.parse(text); }catch(e){ throw new Error("Invalid JSON: "+e.message); }
    // Compact pre-aggregated shape from the mpb-api service (already averaged).
    if(json && json.aggregated && Array.isArray(json.ldevs)){
      const ldevs=json.ldevs.filter(l=>l&&l.mpb).map(l=>({id:String(l.id),name:String(l.name||l.id),mpb:String(l.mpb),readIOPS:+l.readIOPS||0,writeIOPS:+l.writeIOPS||0,readKBps:+l.readKBps||0,writeKBps:+l.writeKBps||0}));
      const mpbs=[]; ldevs.forEach(l=>{ if(mpbs.indexOf(l.mpb)<0) mpbs.push(l.mpb); }); mpbs.sort();
      return {ldevs,mpbs,arr:json.storageArray||"VSP360",skipped:json.skipped||0,series:(json.series&&Array.isArray(json.series.blades))?json.series:null};
    }
    let recs=null;
    if(Array.isArray(json)) recs=json;
    else if(json.result&&Array.isArray(json.result)) recs=json.result;            // ClearSight Advanced dataset
    else if(json.ldevs&&Array.isArray(json.ldevs)) recs=json.ldevs;
    else if(json.data&&Array.isArray(json.data)) recs=json.data;
    else if(json.records&&Array.isArray(json.records)) recs=json.records;
    if(!recs||!recs.length) throw new Error("Could not find an LDEV array in the JSON (expected ClearSight .result, or an array / .ldevs / .data / .records).");
    // Average a metric: ClearSight gives [{type:'timeseries', data:[...]}]; tolerate raw arrays / scalars too.
    const tsAvg=(field)=>{ if(field==null) return 0; if(!Array.isArray(field)) return Number(field)||0; let s=0,n=0; field.forEach(ts=>{ const arr=(ts&&ts.data)||(typeof ts==="number"?[ts]:null); if(Array.isArray(arr)){ arr.forEach(v=>{ if(v!=null&&isFinite(v)){ s+=v; n++; } }); } else if(typeof ts==="number"&&isFinite(ts)){ s+=ts; n++; } }); return n?s/n:0; };
    let ldevs, arr="Imported array", skipped=0;
    if(recs[0] && typeof recs[0].signature==="string"){
      // result[] of raidLdev objects with timeseries metrics + related raidMPB
      let serial="";
      const mapped=recs.filter(r=>typeof r.signature==="string" && r.signature.indexOf("raidLdev#")===0).map(r=>{
        const raw=r.signature.replace(/^raidLdev#/,"");   // 70249-00^FE^E4
        const parts=raw.split("^");                        // ["70249-00","FE","E4"]
        const head=parts[0].split("-");                    // serial, LDKC
        if(head[0]) serial=head[0];
        const id=[head.length>1?head[1]:"00"].concat(parts.slice(1)).join(":"); // 00:FE:E4
        const rel=(r.related||[]).filter(x=>x&&typeof x.signature==="string"&&x.signature.indexOf("raidMPB#")===0)[0];
        let mpb="";
        if(rel&&rel.signature){ const m=rel.signature.replace(/^raidMPB#/,"").match(/MP[A-Z]*-?\d+/i); mpb=m?m[0]:rel.signature.replace(/^raidMPB#/,"").replace(/^\d+-/,""); }
        return {id:id,name:id,mpb:mpb,readIOPS:tsAvg(r.readIOPS),writeIOPS:tsAvg(r.writeIOPS),readKBps:tsAvg(r.readTransRate),writeKBps:tsAvg(r.writeTransRate)};
      });
      // An LDEV with no resolvable raidMPB can't be balanced (unknown blade) — drop it.
      ldevs=mapped.filter(l=>l.mpb);
      skipped=mapped.length-ldevs.length;
      if(serial) arr=serial;
    } else {
      ldevs=recs.map((rec,i)=>{
        const name=rec.name||rec.ldevNaming||rec.ldevName||("LDEV-"+i);
        const lid=rec.id||rec.ldevId||rec.ldev||name;
        const mpb=rec.mpb||rec.mpu||"MPU-010";
        return {id:String(lid),name:String(name),mpb:String(mpb),
          readIOPS:tsAvg(rec.readIOPS!=null?rec.readIOPS:rec.readIops),
          writeIOPS:tsAvg(rec.writeIOPS!=null?rec.writeIOPS:rec.writeIops),
          readKBps:tsAvg(rec.readTransRate!=null?rec.readTransRate:rec.readKBps),
          writeKBps:tsAvg(rec.writeTransRate!=null?rec.writeTransRate:rec.writeKBps)};
      });
      arr=json.storageArray||json.array||"Imported array";
    }
    if(!ldevs.length) throw new Error("No LDEV records parsed.");
    const mpbs=[]; ldevs.forEach(l=>{ if(mpbs.indexOf(l.mpb)<0) mpbs.push(l.mpb); }); mpbs.sort();
